[project]
name = "tracereplay"
version = "0.1.0"
description = "OpenTelemetry recorder + step-by-step replay/re-execution for LLM agents"
requires-python = ">=3.10"
dependencies = ["opentelemetry-sdk>=1.25"]
license = {text = "MIT"}

[project.scripts]
tracereplay = "tracereplay.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tracereplay"]
